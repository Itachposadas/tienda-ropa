<div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
            {% if producto %}
                <i class="bi bi-pencil"></i> Editar Producto: {{ producto.nombre }}
            {% else %}
                <i class="bi bi-plus-lg"></i> Nuevo Producto
            {% endif %}
        </h5>
    </div>
    <div class="card-body">
        <form 
            hx-post="{% if producto %}/admin/productos/editar/{{ producto.id_producto }}{% else %}/admin/productos/nuevo{% endif %}"
            hx-target="#productos .tab-content-inner"
            hx-swap="innerHTML"
        >
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="nombre" class="form-label">Nombre *</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" 
                           value="{{ producto.nombre if producto else '' }}" required maxlength="100">
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="id_categoria" class="form-label">Categoría</label>
                    <select class="form-select" id="id_categoria" name="id_categoria">
                        <option value="">-- Sin categoría --</option>
                        {% for cat in categorias %}
                        <option value="{{ cat.id_categoria }}" 
                            {% if producto and producto.id_categoria == cat.id_categoria %}selected{% endif %}>
                            {{ cat.nombre }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label for="precio" class="form-label">Precio *</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" id="precio" name="precio" 
                               value="{{ producto.precio if producto else '' }}" 
                               required step="0.01" min="0">
                    </div>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label for="stock" class="form-label">Stock</label>
                    <input type="number" class="form-control" id="stock" name="stock" 
                           value="{{ producto.stock if producto else '0' }}" 
                           min="0" step="1">
                </div>
                
                <div class="col-md-4 mb-3">
                    <label for="talla" class="form-label">Talla</label>
                    <select class="form-select" id="talla" name="talla">
                        <option value="">-- Sin talla --</option>
                        <option value="XS" {% if producto and producto.talla == 'XS' %}selected{% endif %}>XS</option>
                        <option value="S" {% if producto and producto.talla == 'S' %}selected{% endif %}>S</option>
                        <option value="M" {% if producto and producto.talla == 'M' %}selected{% endif %}>M</option>
                        <option value="L" {% if producto and producto.talla == 'L' %}selected{% endif %}>L</option>
                        <option value="XL" {% if producto and producto.talla == 'XL' %}selected{% endif %}>XL</option>
                    </select>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="color" class="form-label">Color</label>
                    <input type="text" class="form-control" id="color" name="color" 
                           value="{{ producto.color if producto else '' }}" maxlength="50">
                </div>
                
                <div class="col-12 mb-3">
                    <label for="descripcion" class="form-label">Descripción</label>
                    <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ producto.descripcion if producto else '' }}</textarea>
                </div>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-lg"></i> 
                    {% if producto %}Guardar Cambios{% else %}Crear Producto{% endif %}
                </button>
                <button type="button" class="btn btn-outline-secondary" 
                        hx-get="/admin/productos" 
                        hx-target="#productos .tab-content-inner"
                        hx-swap="innerHTML">
                    <i class="bi bi-x-lg"></i> Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
