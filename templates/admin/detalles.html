<h4><i class="bi bi-list-ul"></i> Detalles de Venta</h4>
<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Venta #</th>
                <th>Producto</th>
                <th>Cantidad</th>
                <th>Precio Unit.</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            {% for d in detalles %}
            <tr>
                <td>{{ d.id_detalle }}</td>
                <td>{{ d.id_venta }}</td>
                <td>{{ d.producto.nombre if d.producto else d.id_producto }}</td>
                <td>{{ d.cantidad }}</td>
                <td>${{ "%.2f"|format(d.precio_unitario) }}</td>
                <td>${{ "%.2f"|format(d.subtotal) }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
