<div class="d-flex justify-content-between align-items-center mb-3">
    <h4><i class="bi bi-tags"></i> Categorías</h4>
    <button class="btn btn-success btn-sm"
            hx-get="/admin/categorias/nueva"
            hx-target="#categorias .tab-content-inner"
            hx-swap="innerHTML">
        <i class="bi bi-plus-lg"></i> Nueva Categoría
    </button>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Productos</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for c in categorias %}
            <tr>
                <td>{{ c.id_categoria }}</td>
                <td><strong>{{ c.nombre }}</strong></td>
                <td>{{ c.descripcion or '-' }}</td>
                <td><span class="badge bg-info">{{ c.productos|length }}</span></td>
                <td>
                    <div class="btn-group btn-group-sm">
                        <button class="btn btn-outline-warning"
                                hx-get="/admin/categorias/editar/{{ c.id_categoria }}"
                                hx-target="#categorias .tab-content-inner"
                                hx-swap="innerHTML"
                                title="Editar">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-outline-danger"
                                hx-post="/admin/categorias/eliminar/{{ c.id_categoria }}"
                                hx-target="#categorias .tab-content-inner"
                                hx-swap="innerHTML"
                                hx-confirm="¿Eliminar la categoría '{{ c.nombre }}'?"
                                title="Eliminar">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
