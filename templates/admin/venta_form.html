<div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
            {% if venta %}
                <i class="bi bi-pencil"></i> Editar Venta #{{ venta.id_venta }}
            {% else %}
                <i class="bi bi-plus-lg"></i> Nueva Venta
            {% endif %}
        </h5>
    </div>
    <div class="card-body">
        <form 
            hx-post="{% if venta %}/admin/ventas/editar/{{ venta.id_venta }}{% else %}/admin/ventas/nueva{% endif %}"
            hx-target="#ventas .tab-content-inner"
            hx-swap="innerHTML"
        >
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="fecha" class="form-label">Fecha *</label>
                    <input type="date" class="form-control" id="fecha" name="fecha" 
                           value="{{ venta.fecha.strftime('%Y-%m-%d') if venta and venta.fecha else '' }}" required>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label for="total" class="form-label">Total *</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" id="total" name="total" 
                               value="{{ venta.total if venta else '' }}" 
                               required step="0.01" min="0">
                    </div>
                </div>
                
                <div class="col-md-4 mb-3">
                    <label for="metodo_pago" class="form-label">Método de Pago</label>
                    <select class="form-select" id="metodo_pago" name="metodo_pago">
                        <option value="">-- Seleccionar --</option>
                        <option value="Efectivo" {% if venta and venta.metodo_pago == 'Efectivo' %}selected{% endif %}>Efectivo</option>
                        <option value="Tarjeta" {% if venta and venta.metodo_pago == 'Tarjeta' %}selected{% endif %}>Tarjeta</option>
                        <option value="Transferencia" {% if venta and venta.metodo_pago == 'Transferencia' %}selected{% endif %}>Transferencia</option>
                    </select>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label for="id_usuario" class="form-label">Usuario (Vendedor)</label>
                    <select class="form-select" id="id_usuario" name="id_usuario">
                        <option value="">-- Sin usuario --</option>
                        {% for u in usuarios %}
                        <option value="{{ u.id_usuario }}" 
                            {% if venta and venta.id_usuario == u.id_usuario %}selected{% endif %}>
                            {{ u.nombre_usuario }} ({{ u.nombre }} {{ u.apellido }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-lg"></i> 
                    {% if venta %}Guardar Cambios{% else %}Crear Venta{% endif %}
                </button>
                <button type="button" class="btn btn-outline-secondary" 
                        hx-get="/admin/ventas" 
                        hx-target="#ventas .tab-content-inner"
                        hx-swap="innerHTML">
                    <i class="bi bi-x-lg"></i> Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
