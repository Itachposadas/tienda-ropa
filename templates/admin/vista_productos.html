<h4><i class="bi bi-eye"></i> Vista de Productos <span class="badge bg-info">Solo lectura</span></h4>
<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Stock</th>
            </tr>
        </thead>
        <tbody>
            {% for vp in vista %}
            <tr>
                <td>{{ vp.nombre }}</td>
                <td>{{ vp.categoria }}</td>
                <td>${{ "%.2f"|format(vp.precio) }}</td>
                <td>{{ vp.stock }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
