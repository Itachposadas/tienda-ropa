<div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">
            {% if categoria %}
                <i class="bi bi-pencil"></i> Editar Categoría: {{ categoria.nombre }}
            {% else %}
                <i class="bi bi-plus-lg"></i> Nueva Categoría
            {% endif %}
        </h5>
    </div>
    <div class="card-body">
        <form 
            hx-post="{% if categoria %}/admin/categorias/editar/{{ categoria.id_categoria }}{% else %}/admin/categorias/nueva{% endif %}"
            hx-target="#categorias .tab-content-inner"
            hx-swap="innerHTML"
        >
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre *</label>
                <input type="text" class="form-control" id="nombre" name="nombre" 
                       value="{{ categoria.nombre if categoria else '' }}" required maxlength="100">
            </div>
            
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" name="descripcion" rows="3" maxlength="255">{{ categoria.descripcion if categoria else '' }}</textarea>
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success">
                    <i class="bi bi-check-lg"></i> 
                    {% if categoria %}Guardar Cambios{% else %}Crear Categoría{% endif %}
                </button>
                <button type="button" class="btn btn-outline-secondary" 
                        hx-get="/admin/categorias" 
                        hx-target="#categorias .tab-content-inner"
                        hx-swap="innerHTML">
                    <i class="bi bi-x-lg"></i> Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
