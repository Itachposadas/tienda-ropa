<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Tienda de Ropa</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shop"></i> Tienda de Ropa - Administración
            </a>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="container main-container">
        <h2 class="page-title">
            <i class="bi bi-speedometer2"></i> Panel de Administración
        </h2>

        <!-- Card principal -->
        <div class="card-admin">
            <!-- Pestañas de navegación -->
            <ul class="nav nav-tabs" id="adminTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="productos-tab" data-bs-toggle="tab" 
                            data-bs-target="#productos" type="button" role="tab"
                            hx-get="/admin/productos" hx-trigger="click once" hx-target="#productos .tab-content-inner">
                        <i class="bi bi-box-seam"></i> Productos
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="categorias-tab" data-bs-toggle="tab" 
                            data-bs-target="#categorias" type="button" role="tab"
                            hx-get="/admin/categorias" hx-trigger="click once" hx-target="#categorias .tab-content-inner">
                        <i class="bi bi-tags"></i> Categorías
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="usuarios-tab" data-bs-toggle="tab" 
                            data-bs-target="#usuarios" type="button" role="tab"
                            hx-get="/admin/usuarios" hx-trigger="click once" hx-target="#usuarios .tab-content-inner">
                        <i class="bi bi-people"></i> Usuarios
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="ventas-tab" data-bs-toggle="tab" 
                            data-bs-target="#ventas" type="button" role="tab"
                            hx-get="/admin/ventas" hx-trigger="click once" hx-target="#ventas .tab-content-inner">
                        <i class="bi bi-cart-check"></i> Ventas
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="detalles-tab" data-bs-toggle="tab" 
                            data-bs-target="#detalles" type="button" role="tab"
                            hx-get="/admin/detalles" hx-trigger="click once" hx-target="#detalles .tab-content-inner">
                        <i class="bi bi-list-ul"></i> Detalles
                    </button>
                </li>
            </ul>

            <!-- Contenido de las pestañas -->
            <div class="tab-content" id="adminTabsContent">
                <!-- Productos -->
                <div class="tab-pane fade show active" id="productos" role="tabpanel">
                    <div class="tab-content-inner">
                        <div class="text-center py-5">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Cargando...</span>
                            </div>
                            <p class="mt-3 text-muted">Cargando productos...</p>
                        </div>
                    </div>
                </div>
                
                <!-- Categorías -->
                <div class="tab-pane fade" id="categorias" role="tabpanel">
                    <div class="tab-content-inner">
                        <div class="text-center py-5">
                            <p class="text-muted">Haz clic en la pestaña para cargar datos</p>
                        </div>
                    </div>
                </div>
                
                <!-- Usuarios -->
                <div class="tab-pane fade" id="usuarios" role="tabpanel">
                    <div class="tab-content-inner">
                        <div class="text-center py-5">
                            <p class="text-muted">Haz clic en la pestaña para cargar datos</p>
                        </div>
                    </div>
                </div>
                
                <!-- Ventas -->
                <div class="tab-pane fade" id="ventas" role="tabpanel">
                    <div class="tab-content-inner">
                        <div class="text-center py-5">
                            <p class="text-muted">Haz clic en la pestaña para cargar datos</p>
                        </div>
                    </div>
                </div>
                
                <!-- Detalles de Venta -->
                <div class="tab-pane fade" id="detalles" role="tabpanel">
                    <div class="tab-content-inner">
                        <div class="text-center py-5">
                            <p class="text-muted">Haz clic en la pestaña para cargar datos</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</body>
</html>
