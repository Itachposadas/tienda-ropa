version: '3.8'

services:
  mariadb:
    image: mariadb:latest
    container_name: tienda_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: tienda_ropa
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - tienda_network
    restart: unless-stopped

  app:
    build: .
    container_name: tienda_app
    ports:
      - "5000:5000"
    depends_on:
      - mariadb
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: tienda_ropa
      DB_USER: root
      DB_PASSWORD: 123456
      SECRET_KEY: tienda_ropa_2026
    volumes:
      - .:/app
    networks:
      - tienda_network
    restart: unless-stopped

volumes:
  mariadb_data:

networks:
  tienda_network:
    driver: bridge